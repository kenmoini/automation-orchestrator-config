---
- name: Manage Orchestrator Credentials Block
  vars:
    ansible_async_dir: "{{ orchestrator_configuration_async_dir }}"
  no_log: "{{ orchestrator_configuration_credentials_secure_logging }}"
  block:
    - name: Managing Credentials
      kenmoini.automation_orchestrator_config.credential:
        name: "{{ __orchestrator_credentials_item.name | mandatory }}"
        new_name: "{{ __orchestrator_credentials_item.new_name | default(omit, true) }}"
        description: >-
          {{ __orchestrator_credentials_item.description | default(('' if orchestrator_configuration_credentials_enforce_defaults else
          omit), true) }}
        credential_type: "{{ __orchestrator_credentials_item.credential_type | default(omit, true) }}"
        project: "{{ __orchestrator_credentials_item.project | mandatory }}"
        inputs: "{{ __orchestrator_credentials_item.inputs | default(omit, true) }}"
        enabled: "{{ __orchestrator_credentials_item.enabled | default(omit) }}"
        labels: >-
          {{ __orchestrator_credentials_item.labels | default(({} if orchestrator_configuration_credentials_enforce_defaults else omit),
          true) }}
        update_secrets: "{{ __orchestrator_credentials_item.update_secrets | default(omit) }}"
        state: "{{ __orchestrator_credentials_item.state | default(orchestrator_state | default('present')) }}"

        # Role Standard Options
        orchestrator_host: "{{ orchestrator_hostname | default(omit, true) }}"
        orchestrator_username: "{{ orchestrator_username | default(omit, true) }}"
        orchestrator_password: "{{ orchestrator_password | default(omit, true) }}"
        orchestrator_token: "{{ orchestrator_token | default(omit, true) }}"
        orchestrator_client_id: "{{ orchestrator_client_id | default(omit, true) }}"
        orchestrator_client_secret: "{{ orchestrator_client_secret | default(omit, true) }}"
        validate_certs: "{{ orchestrator_validate_certs | default(omit) }}"
        request_timeout: "{{ orchestrator_request_timeout | default(10, true) }}"
      loop: "{{ orchestrator_credentials }}"
      loop_control:
        loop_var: __orchestrator_credentials_item
        label: "{{ __operation.verb }} credential {{ __orchestrator_credentials_item.name }}"
        pause: "{{ orchestrator_configuration_credentials_loop_delay }}"
      async: "{{ ansible_check_mode | ternary(0, 1000) }}"
      poll: 0
      register: __orchestrator_credentials_job_async
      changed_when: (__orchestrator_credentials_job_async.changed if ansible_check_mode else false)
      vars:
        __operation: "{{ operation_translate[__orchestrator_credentials_item.state | default(orchestrator_state) | default('present')] }}"

    - name: Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __orchestrator_credentials_job_async.failed is defined and __orchestrator_credentials_job_async.failed

    - name: Managing Orchestrator Credentials | Wait for finish the Credentials management
      when:
        - not ansible_check_mode
        - __orchestrator_credentials_job_async_results_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: kenmoini.automation_orchestrator_config.collect_async_status
      loop: "{{ __orchestrator_credentials_job_async.results }}"
      loop_control:
        loop_var: __orchestrator_credentials_job_async_results_item
        label: >-
          {{ __operation.verb }} Orchestrator Credential {{
          __orchestrator_credentials_job_async_results_item.__orchestrator_credentials_item.name }} | Wait for finish the
          credential {{ __operation.action }}
      vars:
        cas_secure_logging: "{{ orchestrator_configuration_credentials_secure_logging }}"
        cas_async_delay: "{{ orchestrator_configuration_credentials_async_delay }}"
        cas_async_retries: "{{ orchestrator_configuration_credentials_async_retries }}"
        cas_job_async_results_item: "{{ __orchestrator_credentials_job_async_results_item }}"
        cas_register_subvar: orchestrator_credentials
        cas_error_list_var_name: "orchestrator_credentials_errors"
        __operation: >-
          {{ operation_translate[__orchestrator_credentials_job_async_results_item.__orchestrator_credentials_item.state |
          default(orchestrator_state) | default('present')] }}
        cas_object_label: >-
          {{ __operation.verb }} Orchestrator Credential {{
          __orchestrator_credentials_job_async_results_item.__orchestrator_credentials_item.name }} | Wait for finish the
          credential {{ __operation.action }}

  always:
    - name: Cleanup async results files
      when:
        - not ansible_check_mode
        - __orchestrator_credentials_job_async_results_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __orchestrator_credentials_job_async_results_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __orchestrator_credentials_job_async.results }}"
      loop_control:
        loop_var: __orchestrator_credentials_job_async_results_item
        label: "Cleaning up job results file: {{ __orchestrator_credentials_job_async_results_item.results_file | default('Unknown') }}"
...
