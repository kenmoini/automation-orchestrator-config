---
argument_specs:
  main:
    short_description: An Ansible Role to launch workflow executions in Automation Orchestrator.
    options:
      orchestrator_launch_executions:
        description: Data structure describing your workflow executions to launch
        type: list
        elements: dict
#        options:
#          workflow:
#            required: true
#            type: str
#            description: Name or UUID of the workflow to run.
#          project:
#            required: false
#            type: str
#            description: Name or UUID of the project that holds the workflow. Required when workflow is a name.
#          trigger_node_id:
#            required: false
#            type: str
#            description: ID of the trigger node to start from. When omitted the workflow must have exactly one trigger.
#          input_data:
#            required: false
#            type: dict
#            description: Input data passed to the execution.
#          use_published:
#            required: false
#            type: bool
#            description: Run the published version of the workflow instead of the current one.
#          wait:
#            required: false
#            type: bool
#            description: Poll the execution until it reaches a final state. A paused execution ends the wait without failing.
#          interval:
#            required: false
#            type: float
#            description: Seconds between polls when wait is true.
#          timeout:
#            required: false
#            type: int
#            description: Seconds to wait for the execution when wait is true. 0 waits without limit.

      # No_log variables
      orchestrator_configuration_execution_launch_secure_logging:
        default: "{{ orchestrator_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: >-
          Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will
          be providing your sensitive values from elsewhere.
      orchestrator_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      orchestrator_hostname:
        default: None
        required: false
        description: Hostname or URL of the Automation Orchestrator server.
        type: str
      orchestrator_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Automation Orchestrator server's SSL certificate.
        type: bool
      orchestrator_username:
        default: None
        required: false
        description: User on the Automation Orchestrator server. Either username / password, a token, or client ID / secret needs to be specified.
        type: str
      orchestrator_password:
        default: None
        required: false
        description: >-
          Password of the user on the Automation Orchestrator server. This should be stored in an Ansible Vault or
          elsewhere and called from a parent playbook.
        type: str
      orchestrator_token:
        default: None
        required: false
        description: Token for the Automation Orchestrator server. This should be stored in an Ansible Vault or elsewhere and called from a parent playbook.
        type: str
      orchestrator_client_id:
        default: None
        required: false
        description: OAuth client ID for the Automation Orchestrator server, used with the client secret.
        type: str
      orchestrator_client_secret:
        default: None
        required: false
        description: >-
          OAuth client secret for the Automation Orchestrator server. This should be stored in an Ansible Vault or
          elsewhere and called from a parent playbook.
        type: str
      orchestrator_request_timeout:
        default: 10
        required: false
        description: Timeout in seconds for requests to the Automation Orchestrator server.
        type: float
...
