---
- name: Manage Orchestrator Policies Block
  vars:
    ansible_async_dir: "{{ orchestrator_configuration_async_dir }}"
  no_log: "{{ orchestrator_configuration_policies_secure_logging }}"
  block:
    - name: Managing Policies
      kenmoini.automation_orchestrator_config.policy:
        name: "{{ __orchestrator_policies_item.name | mandatory }}"
        new_name: "{{ __orchestrator_policies_item.new_name | default(omit, true) }}"
        description: >-
          {{ __orchestrator_policies_item.description | default(('' if orchestrator_configuration_policies_enforce_defaults else omit),
          true) }}
        statements: "{{ __orchestrator_policies_item.statements | default(omit, true) }}"
        labels: "{{ __orchestrator_policies_item.labels | default(({} if orchestrator_configuration_policies_enforce_defaults else omit), true) }}"
        project: "{{ __orchestrator_policies_item.project | default(omit, true) }}"
        state: "{{ __orchestrator_policies_item.state | default(orchestrator_state | default('present')) }}"

        # Role Standard Options
        orchestrator_host: "{{ orchestrator_hostname | default(omit, true) }}"
        orchestrator_username: "{{ orchestrator_username | default(omit, true) }}"
        orchestrator_password: "{{ orchestrator_password | default(omit, true) }}"
        orchestrator_token: "{{ orchestrator_token | default(omit, true) }}"
        orchestrator_client_id: "{{ orchestrator_client_id | default(omit, true) }}"
        orchestrator_client_secret: "{{ orchestrator_client_secret | default(omit, true) }}"
        validate_certs: "{{ orchestrator_validate_certs | default(omit) }}"
        request_timeout: "{{ orchestrator_request_timeout | default(10, true) }}"
      loop: "{{ orchestrator_policies }}"
      loop_control:
        loop_var: __orchestrator_policies_item
        label: "{{ __operation.verb }} policy {{ __orchestrator_policies_item.name }}"
        pause: "{{ orchestrator_configuration_policies_loop_delay }}"
      async: "{{ ansible_check_mode | ternary(0, 1000) }}"
      poll: 0
      register: __orchestrator_policies_job_async
      changed_when: (__orchestrator_policies_job_async.changed if ansible_check_mode else false)
      vars:
        __operation: "{{ operation_translate[__orchestrator_policies_item.state | default(orchestrator_state) | default('present')] }}"

    - name: Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __orchestrator_policies_job_async.failed is defined and __orchestrator_policies_job_async.failed

    - name: Managing Orchestrator Policies | Wait for finish the Policies management
      when:
        - not ansible_check_mode
        - __orchestrator_policies_job_async_results_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: kenmoini.automation_orchestrator_config.collect_async_status
      loop: "{{ __orchestrator_policies_job_async.results }}"
      loop_control:
        loop_var: __orchestrator_policies_job_async_results_item
        label: >-
          {{ __operation.verb }} Orchestrator Policy {{
          __orchestrator_policies_job_async_results_item.__orchestrator_policies_item.name }} | Wait for finish the policy {{
          __operation.action }}
      vars:
        cas_secure_logging: "{{ orchestrator_configuration_policies_secure_logging }}"
        cas_async_delay: "{{ orchestrator_configuration_policies_async_delay }}"
        cas_async_retries: "{{ orchestrator_configuration_policies_async_retries }}"
        cas_job_async_results_item: "{{ __orchestrator_policies_job_async_results_item }}"
        cas_register_subvar: orchestrator_policies
        cas_error_list_var_name: "orchestrator_policies_errors"
        __operation: >-
          {{ operation_translate[__orchestrator_policies_job_async_results_item.__orchestrator_policies_item.state |
          default(orchestrator_state) | default('present')] }}
        cas_object_label: >-
          {{ __operation.verb }} Orchestrator Policy {{
          __orchestrator_policies_job_async_results_item.__orchestrator_policies_item.name }} | Wait for finish the policy {{
          __operation.action }}

  always:
    - name: Cleanup async results files
      when:
        - not ansible_check_mode
        - __orchestrator_policies_job_async_results_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __orchestrator_policies_job_async_results_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __orchestrator_policies_job_async.results }}"
      loop_control:
        loop_var: __orchestrator_policies_job_async_results_item
        label: "Cleaning up job results file: {{ __orchestrator_policies_job_async_results_item.results_file | default('Unknown') }}"
...
