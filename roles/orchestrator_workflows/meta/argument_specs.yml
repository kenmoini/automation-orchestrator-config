#            description: Unpublish the workflow when it has a published version. Mutually exclusive with publish.
#          definition_file:
#            required: false
#            type: path
#            description: >-
#              Path to a JSON or YAML file with the workflow definition, read on the controller by the role (relative paths
#              resolve from the playbook directory) and passed to the module as workflow_definition. Not passed to the module itself.
#          state:
#            default: "{{ orchestrator_state | default('present') }}"
#            required: false
