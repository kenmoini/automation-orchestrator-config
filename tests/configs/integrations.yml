---
# An mcp_server integration with a bogus base_url and without validate/discover,
# so creation does not depend on reachability. Integrations with models/tools
# (which need a reachable provider) are NOT exercised by the live test.
orchestrator_integrations:
  - name: aoc-test-integration
    description: Live test MCP server integration
    integration_type: mcp_server
    configuration:
      base_url: https://example.com/mcp
    validate: false
    discover: false

  - name: aoc-test-aap
    description: OpenShell Test Ansible Automation Platform (AAP) integration
    management_credential: OS-T-HubAAP
    management_credential_project: openshell-test
    integration_type: ansible_automation_platform
    configuration:
      integration_type: ansible_automation_platform
      base_url: https://example.com
      insecure_skip_tls_verify: true
      allow_http: false
      # ca_certificate: |
      #   -----BEGIN CERTIFICATE-----
      #   MII...
      #   -----END CERTIFICATE-----
    scope: global # or project
    # projects:
    #   - openshell-test
    validate: false
    discover: false
...
