---
# Live integration test: configure a lab Automation Orchestrator from tests/configs.
# Authentication comes from tests/auth.yml (gitignored) or the ORCHESTRATOR_* environment variables.
- name: Configure Automation Orchestrator (live test)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    orchestrator_configuration_collect_logs: true
  pre_tasks:
    - name: Include authentication variables from tests/auth.yml when present
      ansible.builtin.include_vars: "{{ playbook_dir }}/auth.yml"
      when: (playbook_dir ~ '/auth.yml') is file
      tags: always

    - name: Default host and certificate validation from the environment
      ansible.builtin.set_fact:
        orchestrator_hostname: "{{ orchestrator_hostname | default(lookup('env', 'ORCHESTRATOR_HOST')) }}"
        orchestrator_validate_certs: "{{ orchestrator_validate_certs | default(lookup('env', 'ORCHESTRATOR_VERIFY_SSL') | default('false', true) | bool) }}"
      tags: always

    # Username and password stay undefined unless tests/auth.yml or the environment provides them,
    # so token-only authentication (orchestrator_token in tests/auth.yml) works.
    - name: Default the username from the environment when it is set there
      ansible.builtin.set_fact:
        orchestrator_username: "{{ lookup('env', 'ORCHESTRATOR_USERNAME') }}"
      when:
        - orchestrator_username is not defined
        - lookup('env', 'ORCHESTRATOR_USERNAME') | length > 0
      tags: always

    - name: Default the password from the environment when it is set there
      ansible.builtin.set_fact:
        orchestrator_password: "{{ lookup('env', 'ORCHESTRATOR_PASSWORD') }}"
      when:
        - orchestrator_password is not defined
        - lookup('env', 'ORCHESTRATOR_PASSWORD') | length > 0
      no_log: true
      tags: always

    - name: Fail fast without a hostname
      ansible.builtin.assert:
        that: orchestrator_hostname | default('') | length > 0
        fail_msg: >-
          No Orchestrator hostname. Create tests/auth.yml (see tests/auth.yml.example)
          or set the ORCHESTRATOR_HOST, ORCHESTRATOR_USERNAME and ORCHESTRATOR_PASSWORD environment variables.
      tags: always

    - name: Include test configuration variables
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/configs"
        extensions: [yml]
      tags: always
  roles:
    - role: kenmoini.automation_orchestrator_config.dispatch
...
