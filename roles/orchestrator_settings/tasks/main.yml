---
- name: Manage Orchestrator Settings Block
  vars:
    ansible_async_dir: "{{ orchestrator_configuration_async_dir }}"
  no_log: "{{ orchestrator_configuration_settings_secure_logging }}"
  block:
    - name: Managing Settings (dictionary)
      kenmoini.automation_orchestrator_config.setting:
        settings: "{{ orchestrator_settings }}"

        # Role Standard Options
        orchestrator_host: "{{ orchestrator_hostname | default(omit, true) }}"
        orchestrator_username: "{{ orchestrator_username | default(omit, true) }}"
        orchestrator_password: "{{ orchestrator_password | default(omit, true) }}"
        orchestrator_token: "{{ orchestrator_token | default(omit, true) }}"
        orchestrator_client_id: "{{ orchestrator_client_id | default(omit, true) }}"
        orchestrator_client_secret: "{{ orchestrator_client_secret | default(omit, true) }}"
        validate_certs: "{{ orchestrator_validate_certs | default(omit) }}"
        request_timeout: "{{ orchestrator_request_timeout | default(10, true) }}"
      when: orchestrator_settings is mapping

    - name: Managing Settings
      kenmoini.automation_orchestrator_config.setting:
        name: "{{ __orchestrator_settings_item.name | mandatory }}"
        value: "{{ __orchestrator_settings_item.value | default(omit) }}"
        expected_version: "{{ __orchestrator_settings_item.expected_version | default(omit) }}"

        # Role Standard Options
        orchestrator_host: "{{ orchestrator_hostname | default(omit, true) }}"
        orchestrator_username: "{{ orchestrator_username | default(omit, true) }}"
        orchestrator_password: "{{ orchestrator_password | default(omit, true) }}"
        orchestrator_token: "{{ orchestrator_token | default(omit, true) }}"
        orchestrator_client_id: "{{ orchestrator_client_id | default(omit, true) }}"
        orchestrator_client_secret: "{{ orchestrator_client_secret | default(omit, true) }}"
        validate_certs: "{{ orchestrator_validate_certs | default(omit) }}"
        request_timeout: "{{ orchestrator_request_timeout | default(10, true) }}"
      loop: "{{ orchestrator_settings if orchestrator_settings is not mapping else [] }}"
      loop_control:
        loop_var: __orchestrator_settings_item
        label: "{{ __operation.verb }} setting {{ __orchestrator_settings_item.name }}"
        pause: "{{ orchestrator_configuration_settings_loop_delay }}"
      async: "{{ ansible_check_mode | ternary(0, 1000) }}"
      poll: 0
      register: __orchestrator_settings_job_async
      changed_when: (__orchestrator_settings_job_async.changed if ansible_check_mode else false)
      vars:
        __operation: "{{ operation_translate['present'] }}"

    - name: Flag for errors (check mode only)
      ansible.builtin.set_fact:
        error_flag: true
      when: ansible_check_mode and __orchestrator_settings_job_async.failed is defined and __orchestrator_settings_job_async.failed

    - name: Managing Orchestrator Settings | Wait for finish the Settings management
      when:
        - not ansible_check_mode
        - __orchestrator_settings_job_async_results_item.ansible_job_id is defined
      ansible.builtin.include_role:
        name: kenmoini.automation_orchestrator_config.collect_async_status
      loop: "{{ __orchestrator_settings_job_async.results }}"
      loop_control:
        loop_var: __orchestrator_settings_job_async_results_item
        label: >-
          {{ __operation.verb }} Orchestrator Setting {{
          __orchestrator_settings_job_async_results_item.__orchestrator_settings_item.name }} | Wait for finish the setting {{
          __operation.action }}
      vars:
        cas_secure_logging: "{{ orchestrator_configuration_settings_secure_logging }}"
        cas_async_delay: "{{ orchestrator_configuration_settings_async_delay }}"
        cas_async_retries: "{{ orchestrator_configuration_settings_async_retries }}"
        cas_job_async_results_item: "{{ __orchestrator_settings_job_async_results_item }}"
        cas_register_subvar: orchestrator_settings
        cas_error_list_var_name: "orchestrator_settings_errors"
        __operation: "{{ operation_translate['present'] }}"
        cas_object_label: >-
          {{ __operation.verb }} Orchestrator Setting {{
          __orchestrator_settings_job_async_results_item.__orchestrator_settings_item.name }} | Wait for finish the setting {{
          __operation.action }}

  always:
    - name: Cleanup async results files
      when:
        - not ansible_check_mode
        - __orchestrator_settings_job_async_results_item.ansible_job_id is defined
      ansible.builtin.async_status:
        jid: "{{ __orchestrator_settings_job_async_results_item.ansible_job_id }}"
        mode: cleanup
      loop: "{{ __orchestrator_settings_job_async.results }}"
      loop_control:
        loop_var: __orchestrator_settings_job_async_results_item
        label: "Cleaning up job results file: {{ __orchestrator_settings_job_async_results_item.results_file | default('Unknown') }}"
...
